<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Spatial Lattice pipeline metro map</title><desc>Simple nf-core-style metro map with optional segmentation and registration branches converging on OME-Zarr export.</desc><rect width="1400" height="900" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#333;font-size:17px}.small{font-size:13px;fill:#666}.line{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.station{fill:white;stroke:#444;stroke-width:2.5}</style><text x="60" y="60" style="font-size:34px;font-weight:bold">spatial lattice</text><text x="60" y="92" class="small">MACSima processing · H&amp;E registration · integrated OME-Zarr</text><path d="M90 210H520H1090V490" fill="none" stroke="#2ca25f" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M520 210V350H690H880L1020 490H1090" fill="none" stroke="#8073ac" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M520 210L620 300H810L880 350" fill="none" stroke="#8073ac" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 9"/><path d="M90 590H880L980 490H1090" fill="none" stroke="#e69f00" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M520 210H555V490L655 590H880" fill="none" stroke="#2ca25f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M280 590V690H510H760L850 615" fill="none" stroke="#e69f00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 9"/><path d="M180 590V780H600H730" fill="none" stroke="#999" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 9"/><path d="M555 490V740H560L600 780" fill="none" stroke="#999" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 9"/><path d="M1090 490H1260" fill="none" stroke="#3182bd" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M1090 490V650" fill="none" stroke="#2ca25f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle class="station" cx="90" cy="210" r="10"/><text x="90" y="182" text-anchor="middle">MACSima</text><text x="90" y="162" text-anchor="middle" class="small">raw ROI images</text><circle class="station" cx="300" cy="210" r="10"/><text x="300" y="252" text-anchor="middle">macsima2mc</text><text x="300" y="273" text-anchor="middle" class="small">stage + convert</text><circle class="station" cx="520" cy="210" r="10"/><text x="520" y="182" text-anchor="middle">ASHLAR</text><text x="520" y="162" text-anchor="middle" class="small">stitch + align</text><circle class="station" cx="690" cy="350" r="10"/><text x="690" y="392" text-anchor="middle">BackSub</text><text x="690" y="413" text-anchor="middle" class="small">optional</text><circle class="station" cx="880" cy="350" r="10"/><circle cx="880" cy="350" r="16" fill="none" stroke="#444" stroke-width="2"/><text x="880" y="270" text-anchor="middle">Segmentation</text><text x="880" y="250" text-anchor="middle" class="small">Cellpose 3 / 4 · Mesmer</text><text x="720" y="280" text-anchor="middle" class="small">or bypass BackSub</text><circle class="station" cx="90" cy="590" r="10"/><text x="90" y="562" text-anchor="middle">H&amp;E</text><text x="90" y="542" text-anchor="middle" class="small">matched image</text><circle class="station" cx="880" cy="590" r="10"/><circle cx="880" cy="590" r="16" fill="none" stroke="#444" stroke-width="2"/><text x="880" y="550" text-anchor="middle">Stainwarpy</text><text x="880" y="530" text-anchor="middle" class="small">register H&amp;E</text><circle class="station" cx="510" cy="690" r="10"/><text x="450" y="730" text-anchor="middle">StainSegMy</text><text x="450" y="751" text-anchor="middle" class="small">optional mask</text><circle class="station" cx="600" cy="780" r="10"/><text x="600" y="820" text-anchor="middle">RAMI2D</text><text x="600" y="841" text-anchor="middle" class="small">legacy optional branch</text><circle class="station" cx="1090" cy="490" r="10"/><circle cx="1090" cy="490" r="16" fill="none" stroke="#444" stroke-width="2"/><text x="1210" y="410" text-anchor="middle">OME-Zarr export</text><text x="1190" y="385" text-anchor="middle" class="small">optional · Cellpose + Stainwarpy required</text><circle class="station" cx="1260" cy="490" r="10"/><text x="1260" y="532" text-anchor="middle">MultiQC</text><text x="1260" y="553" text-anchor="middle" class="small">QC + versions</text><circle class="station" cx="1090" cy="650" r="10"/><text x="1090" y="690" text-anchor="middle">Integrated artifact</text><text x="1090" y="711" text-anchor="middle" class="small">images · labels · transforms</text><text x="820" y="190" text-anchor="middle" class="small">MACSima mosaic</text><text x="970" y="390" text-anchor="middle" class="small">Cellpose labels</text><text x="1160" y="470" text-anchor="middle" class="small">validation QC</text><text x="750" y="765" text-anchor="middle" class="small">separate output</text><text x="1000" y="860" text-anchor="middle" class="small">○ module     ◎ subworkflow     – – optional / bypass route</text><text x="350" y="860" text-anchor="middle" class="small">RAMI2D is not connected to OME-Zarr export.</text></svg>